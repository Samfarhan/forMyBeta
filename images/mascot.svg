<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bodyGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <radialGradient id="earInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Halo / Star Crown -->
  <circle cx="50" cy="22" r="14" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="3,3" opacity="0.85"/>
  <polygon points="50,14 52,19 57,19 53,22 55,27 50,24 45,27 47,22 43,19 48,19" fill="#f59e0b"/>
  <!-- Left Ear -->
  <ellipse cx="36" cy="30" rx="7" ry="16" transform="rotate(-20 36 30)" fill="url(#bodyGlow)" stroke="#f43f5e" stroke-width="1"/>
  <ellipse cx="36" cy="31" rx="4" ry="10" transform="rotate(-20 36 31)" fill="url(#earInner)" opacity="0.75"/>
  <!-- Right Ear -->
  <ellipse cx="64" cy="30" rx="7" ry="16" transform="rotate(20 64 30)" fill="url(#bodyGlow)" stroke="#f43f5e" stroke-width="1"/>
  <ellipse cx="64" cy="31" rx="4" ry="10" transform="rotate(20 64 31)" fill="url(#earInner)" opacity="0.75"/>
  <!-- Head & Body -->
  <ellipse cx="50" cy="58" rx="28" ry="24" fill="url(#bodyGlow)" filter="url(#softGlow)" stroke="#f43f5e" stroke-width="1.2"/>
  <!-- Eyes -->
  <circle cx="41" cy="54" r="3.2" fill="#1e1b4b"/>
  <circle cx="42" cy="53" r="1" fill="#ffffff"/>
  <circle cx="59" cy="54" r="3.2" fill="#1e1b4b"/>
  <circle cx="60" cy="53" r="1" fill="#ffffff"/>
  <!-- Blushing Cheeks -->
  <ellipse cx="34" cy="60" rx="4.5" ry="2.5" fill="#fb7185" opacity="0.6"/>
  <ellipse cx="66" cy="60" rx="4.5" ry="2.5" fill="#fb7185" opacity="0.6"/>
  <!-- Mouth / Smile -->
  <path d="M 47 60 Q 50 63 53 60" fill="none" stroke="#e11d48" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Tiny Heart Gem Paws -->
  <path d="M 50 69 C 48 66, 43 67, 43 71 C 43 75, 50 78, 50 80 C 50 78, 57 75, 57 71 C 57 67, 52 66, 50 69 Z" fill="#e11d48"/>
</svg>
