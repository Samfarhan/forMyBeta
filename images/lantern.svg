<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="100%" height="100%">
  <defs>
    <radialGradient id="lanternCoreGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="ribGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="50%" stop-color="rgba(254,240,138,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.2)"/>
    </linearGradient>
    <filter id="lanternOuterGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ambient Aura -->
  <ellipse cx="60" cy="65" rx="46" ry="54" fill="#fb923c" opacity="0.25" filter="url(#lanternOuterGlow)"/>

  <!-- Top Rim -->
  <ellipse cx="60" cy="22" rx="22" ry="5" fill="#78350f" stroke="#fef08a" stroke-width="1"/>

  <!-- Lantern Paper Body -->
  <path d="M 38 22 C 18 45, 16 85, 34 110 C 44 118, 76 118, 86 110 C 104 85, 102 45, 82 22 Z" 
        fill="url(#lanternCoreGlow)" 
        stroke="#fef08a" 
        stroke-width="1.2"
        filter="url(#lanternOuterGlow)"/>

  <!-- Vertical Bamboo Rib Lines -->
  <path d="M 60 22 Q 60 65 60 115" stroke="url(#ribGrad)" stroke-width="1.2" fill="none"/>
  <path d="M 46 22 Q 32 65 44 113" stroke="url(#ribGrad)" stroke-width="1" fill="none"/>
  <path d="M 74 22 Q 88 65 76 113" stroke="url(#ribGrad)" stroke-width="1" fill="none"/>

  <!-- Bottom Rim Collar -->
  <ellipse cx="60" cy="114" rx="26" ry="6" fill="#78350f" stroke="#fef08a" stroke-width="1.2"/>

  <!-- Inner Candle Flame -->
  <ellipse cx="60" cy="85" rx="7" ry="12" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="60" cy="85" rx="14" ry="18" fill="#fef08a" opacity="0.6"/>

  <!-- Hanging Golden Tassel -->
  <line x1="60" y1="120" x2="60" y2="138" stroke="#f59e0b" stroke-width="1.8"/>
  <polygon points="56,138 64,138 62,154 58,154" fill="#fbbf24"/>
  <circle cx="60" cy="138" r="3" fill="#fef08a"/>
</svg>