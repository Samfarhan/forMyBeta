<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For Alyaa | The Celestial Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="css/luxury.css">
  <style>
    @keyframes subtleShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-card {
      animation: subtleShake 0.4s ease-in-out;
    }
    @keyframes floatMascot {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .animate-float-mascot {
      animation: floatMascot 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="cosmic-bg flex items-center justify-center min-h-[100dvh] overflow-hidden relative select-none">

  <!-- Interactive Stardust Canvas -->
  <canvas id="stardustCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

  <!-- Ambient Glow -->
  <div class="ambient-glow-orb w-80 h-80 bg-rose-600/25 top-10 -left-20"></div>
  <div class="ambient-glow-orb w-80 h-80 bg-purple-600/20 bottom-10 -right-20"></div>

  <!-- Main Container -->
  <main class="journey-shell justify-center items-center text-center">
    
    <!-- Vault Card -->
    <div id="vaultCard" class="w-full glass-card p-6 md:p-8 flex flex-col items-center relative z-20 border border-white/20 transition-transform duration-300">
      
      <!-- Mascot Sticker PNG -->
      <div class="relative mb-2">
        <img 
          id="stickerMascot" 
          src="images/mascot.png" 
          alt="Cute Mascot" 
          class="w-20 h-24 object-contain filter drop-shadow-[0_10px_20px_rgba(244,63,94,0.4)] animate-float-mascot cursor-pointer transition-all duration-300"
          onclick="triggerMascotClick()"
        />
        <!-- Speech Bubble -->
        <div id="stickerBubble" class="absolute -top-7 left-1/2 -translate-x-1/2 bg-slate-900/90 border border-pink-500/30 px-2.5 py-1 rounded-full text-[10px] font-bold text-pink-300 whitespace-nowrap shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none">
          Hii Alyaa! ✨
        </div>
      </div>

      <!-- Tagline -->
      <span class="text-[9px] font-extrabold tracking-[0.35em] text-pink-300 uppercase mb-1.5">A PRIVATE ARCHIVE</span>
      
      <!-- Title: For Alyaa -->
      <h1 class="font-luxury text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-pink-100 to-rose-300 mb-2 text-glow-rose leading-tight">
        For Alyaa
      </h1>

      <!-- Dedication Note: LET'S GO BACK. To when we were still us. -->
      <div class="my-2 max-w-xs">
        <p class="text-sm md:text-base font-extrabold tracking-widest text-pink-200 uppercase font-sans-ui">
          LET'S GO BACK.
        </p>
        <p class="text-xs md:text-sm text-slate-300 font-light italic font-luxury mt-1">
          To when we were still us.
        </p>
      </div>

      <!-- Passcode Input Section -->
      <div class="w-full mt-4 flex flex-col items-center gap-2.5 max-w-[260px]">
        <div class="relative w-full">
          <input 
            id="passcodeInput" 
            type="text" 
            inputmode="numeric" 
            maxlength="10" 
            placeholder="Enter date passcode" 
            class="w-full py-3 px-4 rounded-full bg-white/5 border border-white/20 text-center text-white tracking-[0.25em] text-sm focus:outline-none focus:border-pink-400 focus:bg-white/10 transition-all placeholder:text-slate-500 placeholder:tracking-normal placeholder:text-xs"
            autocomplete="off"
          />
        </div>

        <button 
          id="unlockBtn" 
          onclick="validatePasscode()" 
          class="btn-luxury-primary w-full text-xs py-3 cursor-pointer">
          <span>Unlock Vault</span>
          <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>

        <p id="errorText" class="text-[11px] text-rose-400 font-medium h-4 opacity-0 transition-opacity">
          That date doesn't open this vault.
        </p>

        <!-- HINT SECTION -->
        <div class="w-full flex flex-col items-center mt-1">
          <!-- Step 1: Initial Hint Button -->
          <button 
            id="hintBtn" 
            onclick="revealHint()" 
            class="text-[11px] font-medium text-pink-300 hover:text-pink-200 underline decoration-pink-500/40 underline-offset-4 cursor-pointer transition-colors py-1">
            Need a hint? 💡
          </button>

          <!-- Step 2: "enter the day we met" box -->
          <div id="hintBox" class="hidden w-full flex flex-col items-center mt-2 p-2.5 rounded-xl bg-white/5 border border-pink-500/20 text-center animate-fade-in">
            <span class="text-[11px] font-semibold text-pink-200 tracking-wide">
              enter the day we met
            </span>

            <!-- Step 3: "not remember????" -->
            <button 
              id="notRememberBtn" 
              onclick="revealPasscode()" 
              class="text-[10px] text-slate-400 hover:text-rose-300 underline underline-offset-2 mt-1.5 cursor-pointer transition-colors">
              not remember????
            </button>

            <!-- Step 4: The Code Reveal -->
            <div id="codeRevealBox" class="hidden mt-2 pt-2 border-t border-white/10 w-full text-center">
              <span class="text-[9px] text-slate-400 uppercase tracking-widest block">The secret code is:</span>
              <span class="text-sm font-black text-pink-300 tracking-widest font-mono">201123</span>
              <p class="text-[9px] text-pink-400/80 mt-0.5">(20 Nov 2023 • Auto-filled for you ✨)</p>
            </div>
          </div>
        </div>

      </div>

      <!-- Footnote -->
      <div class="mt-4 text-[11px] text-slate-400 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-pink-400 animate-pulse"></span>
        <span>Every memory here is protected</span>
      </div>

    </div>

    <footer class="mt-4 text-[10px] text-slate-500 tracking-wider">
      A Farewell Tribute • Dedicated With Infinite Respect
    </footer>

  </main>

  <script src="js/core.js"></script>
  <script>
    initStardustCanvas();

    const CORRECT_PASS = "201123";

    function validatePasscode() {
      const input = document.getElementById('passcodeInput');
      const card = document.getElementById('vaultCard');
      const errorText = document.getElementById('errorText');
      const rawVal = input.value.trim().replace(/[\/\-\.\s]/g, '');

      if (rawVal === CORRECT_PASS) {
        window.soundEngine.playSuccess();
        errorText.classList.add('opacity-0');
        
        // Happy mascot animation
        const sticker = document.getElementById('stickerMascot');
        if (sticker) sticker.src = 'images/mascot_happy.png';

        gsap.to(card, {
          scale: 0.92,
          opacity: 0,
          filter: 'blur(12px)',
          duration: 0.8,
          ease: 'power2.inOut',
          onComplete: () => {
            window.location.href = 'page1-welcome.html';
          }
        });
      } else {
        window.soundEngine.playPop();
        errorText.classList.remove('opacity-0');
        card.classList.add('shake-card');
        input.value = '';
        
        // Confused mascot
        const sticker = document.getElementById('stickerMascot');
        if (sticker) sticker.src = 'images/mascot_confused.png';

        setTimeout(() => {
          card.classList.remove('shake-card');
        }, 450);
      }
    }

    // Hint Step 1: Click "Need a hint?" -> reveals "enter the day we met" & "not remember????"
    function revealHint() {
      window.soundEngine.playPop();
      document.getElementById('hintBtn').classList.add('hidden');
      const hintBox = document.getElementById('hintBox');
      hintBox.classList.remove('hidden');

      const sticker = document.getElementById('stickerMascot');
      if (sticker) {
        sticker.src = 'images/mascot_confused.png';
        gsap.fromTo(sticker, { rotate: -10 }, { rotate: 0, duration: 0.3 });
      }
    }

    // Hint Step 2: Click "not remember????" -> reveals code 201123 & auto-fills
    function revealPasscode() {
      window.soundEngine.playChime();
      document.getElementById('notRememberBtn').classList.add('hidden');
      const codeBox = document.getElementById('codeRevealBox');
      codeBox.classList.remove('hidden');

      // Auto-fill input
      const input = document.getElementById('passcodeInput');
      input.value = CORRECT_PASS;

      // Happy sticker bounce
      const sticker = document.getElementById('stickerMascot');
      if (sticker) {
        sticker.src = 'images/mascot_happy.png';
        gsap.to(sticker, { y: -15, duration: 0.2, yoyo: true, repeat: 1 });
      }
    }

    function triggerMascotClick() {
      window.soundEngine.playPop();
      const bubble = document.getElementById('stickerBubble');
      bubble.classList.remove('opacity-0');
      setTimeout(() => bubble.classList.add('opacity-0'), 2500);
    }

    // Enter key triggers validate
    document.getElementById('passcodeInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') validatePasscode();
    });
  </script>
</body>
</html>
