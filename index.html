<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For Alyaa | The Celestial Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="css/luxury.css">
  <style>
    @keyframes subtleShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-card {
      animation: subtleShake 0.4s ease-in-out;
    }

    /* Top Fairy Lights Garland */
    .top-bulbs-garland {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      height: auto;
      pointer-events: none;
      z-index: 25;
      mix-blend-mode: screen;
      filter: drop-shadow(0 10px 20px rgba(251, 191, 36, 0.35));
      opacity: 0.9;
    }

    /* Floating Aesthetic Lanterns Animations */
    @keyframes floatLantern1 {
      0% { transform: translateY(105vh) translateX(0px) rotate(-2deg); opacity: 0; }
      10% { opacity: 0.85; }
      50% { transform: translateY(50vh) translateX(25px) rotate(3deg); }
      90% { opacity: 0.85; }
      100% { transform: translateY(-15vh) translateX(-15px) rotate(-2deg); opacity: 0; }
    }

    @keyframes floatLantern2 {
      0% { transform: translateY(105vh) translateX(0px) rotate(3deg); opacity: 0; }
      15% { opacity: 0.75; }
      50% { transform: translateY(45vh) translateX(-30px) rotate(-2deg); }
      85% { opacity: 0.75; }
      100% { transform: translateY(-15vh) translateX(20px) rotate(3deg); opacity: 0; }
    }

    @keyframes lanternGlowPulse {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(251, 146, 60, 0.5)) drop-shadow(0 0 35px rgba(244, 63, 94, 0.3)); }
      50% { filter: drop-shadow(0 0 25px rgba(251, 191, 36, 0.7)) drop-shadow(0 0 45px rgba(236, 72, 153, 0.5)); }
    }

    .aesthetic-lantern {
      position: fixed;
      pointer-events: none;
      z-index: 8;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }

    .lantern-glow-box {
      animation: lanternGlowPulse 4s ease-in-out infinite;
    }

    /* Runaway Mascot Sticker */
    #runawaySticker {
      position: fixed;
      z-index: 45;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease-out;
    }
  </style>
</head>
<body class="cosmic-bg flex items-center justify-center min-h-[100dvh] overflow-hidden relative select-none">

  <!-- Interactive Stardust Canvas -->
  <canvas id="stardustCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

  <!-- Ambient Glow Orbs -->
  <div class="ambient-glow-orb w-80 h-80 bg-rose-600/25 top-10 -left-20"></div>
  <div class="ambient-glow-orb w-80 h-80 bg-purple-600/20 bottom-10 -right-20"></div>

  <!-- TOP BULBS STRING GARLAND -->
  <img src="images/bulbs-string.png" alt="Fairy Lights" class="top-bulbs-garland" onerror="this.style.display='none'">

  <!-- FLOATING AESTHETIC LANTERNS ON SIDES -->
  <!-- Left Side Lantern 1 -->
  <div class="aesthetic-lantern left-3 md:left-12" style="animation: floatLantern1 18s linear infinite;">
    <div class="lantern-glow-box w-12 h-16 md:w-16 md:h-20 rounded-2xl bg-gradient-to-b from-amber-400/30 via-rose-500/40 to-amber-600/60 border border-amber-300/40 flex flex-col items-center justify-between p-1.5 shadow-[0_0_30px_rgba(251,146,60,0.4)]">
      <div class="w-2 h-2 rounded-full bg-amber-200/80"></div>
      <div class="w-4 h-6 rounded-full bg-amber-100/90 blur-[1px] animate-pulse"></div>
      <div class="w-3 h-1 bg-amber-400/80 rounded-full"></div>
    </div>
  </div>

  <!-- Left Side Lantern 2 (delayed) -->
  <div class="aesthetic-lantern left-8 md:left-24" style="animation: floatLantern2 24s linear 7s infinite;">
    <div class="lantern-glow-box w-9 h-12 md:w-12 md:h-16 rounded-xl bg-gradient-to-b from-rose-400/25 via-pink-500/35 to-orange-500/50 border border-pink-300/30 flex flex-col items-center justify-between p-1 shadow-[0_0_20px_rgba(244,63,94,0.3)]">
      <div class="w-1.5 h-1.5 rounded-full bg-pink-200/70"></div>
      <div class="w-3 h-4 rounded-full bg-amber-100/80 blur-[1px] animate-pulse"></div>
      <div class="w-2 h-0.5 bg-rose-400/60 rounded-full"></div>
    </div>
  </div>

  <!-- Right Side Lantern 1 -->
  <div class="aesthetic-lantern right-3 md:right-12" style="animation: floatLantern2 20s linear 2s infinite;">
    <div class="lantern-glow-box w-12 h-16 md:w-16 md:h-20 rounded-2xl bg-gradient-to-b from-amber-400/30 via-rose-500/40 to-amber-600/60 border border-amber-300/40 flex flex-col items-center justify-between p-1.5 shadow-[0_0_30px_rgba(251,146,60,0.4)]">
      <div class="w-2 h-2 rounded-full bg-amber-200/80"></div>
      <div class="w-4 h-6 rounded-full bg-amber-100/90 blur-[1px] animate-pulse"></div>
      <div class="w-3 h-1 bg-amber-400/80 rounded-full"></div>
    </div>
  </div>

  <!-- Right Side Lantern 2 (delayed) -->
  <div class="aesthetic-lantern right-8 md:right-24" style="animation: floatLantern1 26s linear 11s infinite;">
    <div class="lantern-glow-box w-9 h-12 md:w-12 md:h-16 rounded-xl bg-gradient-to-b from-rose-400/25 via-pink-500/35 to-orange-500/50 border border-pink-300/30 flex flex-col items-center justify-between p-1 shadow-[0_0_20px_rgba(244,63,94,0.3)]">
      <div class="w-1.5 h-1.5 rounded-full bg-pink-200/70"></div>
      <div class="w-3 h-4 rounded-full bg-amber-100/80 blur-[1px] animate-pulse"></div>
      <div class="w-2 h-0.5 bg-rose-400/60 rounded-full"></div>
    </div>
  </div>

  <!-- PLAYFUL RUNAWAY STICKER ("mat pakdo!") -->
  <div id="runawaySticker" class="top-24 right-6 md:right-32 w-16 h-20 md:w-20 md:h-24 filter drop-shadow-[0_12px_25px_rgba(244,63,94,0.45)]">
    <!-- Speech Bubble -->
    <div id="runawayBubble" class="absolute -top-9 left-1/2 -translate-x-1/2 bg-slate-900/95 border border-pink-500/50 py-1 px-2.5 rounded-xl shadow-2xl text-[10px] font-extrabold text-pink-300 tracking-wide whitespace-nowrap pointer-events-none transition-all duration-200">
      mat pakdo! 😝
    </div>
    <img id="runawayImg" src="images/mascot.png" alt="Runaway Mascot" class="w-full h-full object-contain">
  </div>

  <!-- Main Container -->
  <main class="journey-shell justify-center items-center text-center">
    
    <!-- Vault Card -->
    <div id="vaultCard" class="w-full glass-card p-6 md:p-8 flex flex-col items-center relative z-20 border border-white/20 transition-transform duration-300">
      
      <!-- Center Emblem Seal -->
      <div class="w-14 h-14 rounded-full bg-pink-500/10 border border-pink-500/30 flex items-center justify-center mb-3 relative">
        <div class="absolute inset-0 rounded-full bg-pink-500/20 animate-ping opacity-30"></div>
        <span class="text-2xl">✨</span>
      </div>

      <!-- Tagline -->
      <span class="text-[9px] font-extrabold tracking-[0.35em] text-pink-300 uppercase mb-1.5">A PRIVATE ARCHIVE</span>
      
      <!-- Title: For Alyaa -->
      <h1 class="font-luxury text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-pink-100 to-rose-300 mb-2 text-glow-rose leading-tight">
        For Alyaa
      </h1>

      <!-- Dedication Note: LET'S GO BACK. To when we were still us. -->
      <div class="my-2 max-w-xs">
        <p class="text-sm md:text-base font-extrabold tracking-widest text-pink-200 uppercase font-sans-ui">
          LET'S GO BACK.
        </p>
        <p class="text-xs md:text-sm text-slate-300 font-light italic font-luxury mt-1">
          To when we were still us.
        </p>
      </div>

      <!-- Passcode Input Section -->
      <div class="w-full mt-4 flex flex-col items-center gap-2.5 max-w-[260px]">
        <div class="relative w-full">
          <input 
            id="passcodeInput" 
            type="text" 
            inputmode="numeric" 
            maxlength="10" 
            placeholder="Enter date passcode" 
            class="w-full py-3 px-4 rounded-full bg-white/5 border border-white/20 text-center text-white tracking-[0.25em] text-sm focus:outline-none focus:border-pink-400 focus:bg-white/10 transition-all placeholder:text-slate-500 placeholder:tracking-normal placeholder:text-xs"
            autocomplete="off"
          />
        </div>

        <button 
          id="unlockBtn" 
          onclick="validatePasscode()" 
          class="btn-luxury-primary w-full text-xs py-3 cursor-pointer">
          <span>Unlock Vault</span>
          <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>

        <p id="errorText" class="text-[11px] text-rose-400 font-medium h-4 opacity-0 transition-opacity">
          That date doesn't open this vault.
        </p>

        <!-- HINT SECTION -->
        <div class="w-full flex flex-col items-center mt-1">
          <!-- Step 1: Initial Hint Button -->
          <button 
            id="hintBtn" 
            onclick="revealHint()" 
            class="text-[11px] font-medium text-pink-300 hover:text-pink-200 underline decoration-pink-500/40 underline-offset-4 cursor-pointer transition-colors py-1">
            Need a hint? 💡
          </button>

          <!-- Step 2: "enter the day we met" box -->
          <div id="hintBox" class="hidden w-full flex flex-col items-center mt-2 p-2.5 rounded-xl bg-white/5 border border-pink-500/20 text-center animate-fade-in">
            <span class="text-[11px] font-semibold text-pink-200 tracking-wide">
              enter the day we met
            </span>

            <!-- Step 3: "not remember????" -->
            <button 
              id="notRememberBtn" 
              onclick="revealPasscode()" 
              class="text-[10px] text-slate-400 hover:text-rose-300 underline underline-offset-2 mt-1.5 cursor-pointer transition-colors">
              not remember????
            </button>

            <!-- Step 4: The Code Reveal -->
            <div id="codeRevealBox" class="hidden mt-2 pt-2 border-t border-white/10 w-full text-center">
              <span class="text-[9px] text-slate-400 uppercase tracking-widest block">The secret code is:</span>
              <span class="text-sm font-black text-pink-300 tracking-widest font-mono">201123</span>
              <p class="text-[9px] text-pink-400/80 mt-0.5">(20 Nov 2023 • Auto-filled for you ✨)</p>
            </div>
          </div>
        </div>

      </div>

      <!-- Footnote -->
      <div class="mt-4 text-[11px] text-slate-400 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-pink-400 animate-pulse"></span>
        <span>Every memory here is protected</span>
      </div>

    </div>

    <footer class="mt-4 text-[10px] text-slate-500 tracking-wider">
      A Farewell Tribute • Dedicated With Infinite Respect
    </footer>

  </main>

  <script src="js/core.js"></script>
  <script>
    initStardustCanvas();

    const CORRECT_PASS = "201123";

    function validatePasscode() {
      const input = document.getElementById('passcodeInput');
      const card = document.getElementById('vaultCard');
      const errorText = document.getElementById('errorText');
      const rawVal = input.value.trim().replace(/[\/\-\.\s]/g, '');

      if (rawVal === CORRECT_PASS) {
        window.soundEngine.playSuccess();
        errorText.classList.add('opacity-0');
        
        gsap.to(card, {
          scale: 0.92,
          opacity: 0,
          filter: 'blur(12px)',
          duration: 0.8,
          ease: 'power2.inOut',
          onComplete: () => {
            window.location.href = 'page1-welcome.html';
          }
        });
      } else {
        window.soundEngine.playPop();
        errorText.classList.remove('opacity-0');
        card.classList.add('shake-card');
        input.value = '';
        setTimeout(() => {
          card.classList.remove('shake-card');
        }, 450);
      }
    }

    // Hint Step 1: Click "Need a hint?" -> reveals "enter the day we met" & "not remember????"
    function revealHint() {
      window.soundEngine.playPop();
      document.getElementById('hintBtn').classList.add('hidden');
      const hintBox = document.getElementById('hintBox');
      hintBox.classList.remove('hidden');
    }

    // Hint Step 2: Click "not remember????" -> reveals code 201123 & auto-fills
    function revealPasscode() {
      window.soundEngine.playChime();
      document.getElementById('notRememberBtn').classList.add('hidden');
      const codeBox = document.getElementById('codeRevealBox');
      codeBox.classList.remove('hidden');

      // Auto-fill input
      const input = document.getElementById('passcodeInput');
      input.value = CORRECT_PASS;
    }

    // Enter key triggers validate
    document.getElementById('passcodeInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') validatePasscode();
    });

    // ===============================================
    // RUNAWAY STICKER LOGIC ("mat pakdo!")
    // ===============================================
    const runawaySticker = document.getElementById('runawaySticker');
    const runawayBubble = document.getElementById('runawayBubble');
    const runawayImg = document.getElementById('runawayImg');

    const funnyQuotes = [
      "mat pakdo! 🏃‍♂️💨",
      "arre mat pakdo mujhe! 😝",
      "pakad ke dikhao! 😜",
      "hehe door raho! 💨",
      "nahi pakad paoge Alyaa! ✨",
      "bhaag raha hu mai! 🏃‍♀️"
    ];
    let quoteIdx = 0;
    let dodgeCount = 0;

    function dodgeSticker(cursorX, cursorY) {
      window.soundEngine.playPop();
      dodgeCount++;

      // Change speech bubble
      quoteIdx = (quoteIdx + 1) % funnyQuotes.length;
      runawayBubble.textContent = funnyQuotes[quoteIdx];
      runawayImg.src = 'images/mascot_confused.png';

      // Pick random coordinates within screen margins
      const margin = 70;
      const maxX = window.innerWidth - margin - 80;
      const maxY = window.innerHeight - margin - 90;
      let newX = Math.random() * (maxX - margin) + margin;
      let newY = Math.random() * (maxY - margin) + margin;

      // Ensure it runs away from cursor
      if (cursorX && Math.abs(newX - cursorX) < 90) {
        newX = cursorX > window.innerWidth / 2 ? newX - 120 : newX + 120;
      }
      if (cursorY && Math.abs(newY - cursorY) < 90) {
        newY = cursorY > window.innerHeight / 2 ? newY - 120 : newY + 120;
      }

      // Constrain inside viewport
      newX = Math.max(20, Math.min(newX, window.innerWidth - 90));
      newY = Math.max(60, Math.min(newY, window.innerHeight - 110));

      gsap.to(runawaySticker, {
        left: newX + 'px',
        top: newY + 'px',
        right: 'auto',
        rotation: (Math.random() - 0.5) * 25,
        duration: 0.35,
        ease: 'power2.out',
        onComplete: () => {
          setTimeout(() => {
            runawayImg.src = 'images/mascot.png';
          }, 600);
        }
      });
    }

    // Desktop: Approach detection within 85px
    window.addEventListener('mousemove', (e) => {
      const rect = runawaySticker.getBoundingClientRect();
      const stickerCenterX = rect.left + rect.width / 2;
      const stickerCenterY = rect.top + rect.height / 2;
      const distance = Math.hypot(e.clientX - stickerCenterX, e.clientY - stickerCenterY);

      if (distance < 85) {
        dodgeSticker(e.clientX, e.clientY);
      }
    });

    // Mobile touch detection
    runawaySticker.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      dodgeSticker(touch.clientX, touch.clientY);
    }, { passive: false });

    // Catch reward if clicked
    runawaySticker.addEventListener('click', () => {
      window.soundEngine.playChime();
      runawayBubble.textContent = "ouch! pakad liya 🙈🤍";
      runawayImg.src = 'images/mascot_happy.png';
      gsap.to(runawaySticker, { scale: 1.15, yoyo: true, repeat: 1, duration: 0.2 });
    });
  </script>
</body>
</html>
