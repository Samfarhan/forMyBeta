<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Soundtrack | For My Beta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="css/luxury.css">
  <style>
    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spinning-vinyl {
      animation: spinDisc 8s linear infinite;
    }
    .paused-vinyl {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="cosmic-bg min-h-[100dvh] overflow-x-hidden relative">

  <canvas id="stardustCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>
  <div class="ambient-glow-orb w-72 h-72 bg-purple-600/20 top-10 -left-20"></div>

  <div id="companionMascot" class="animate-roaming-mascot"></div>

  <main class="journey-shell">
    
    <header class="pt-4 text-center">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-pink-500/10 border border-pink-500/20 mb-2">
        <span class="w-1.5 h-1.5 rounded-full bg-pink-400"></span>
        <span class="text-[9px] font-extrabold tracking-[0.3em] text-pink-300 uppercase">CHAPTER 07</span>
      </div>
      <h1 class="font-luxury text-2xl md:text-3xl font-bold text-white text-glow-rose">
        The Soundtrack of Us ðŸŽµ
      </h1>
      <p class="text-xs text-slate-400 mt-1">Songs that carry the echoes of our memories</p>
    </header>

    <!-- Vinyl Player Console -->
    <div class="glass-card p-5 my-3 flex flex-col items-center border border-white/15 relative overflow-hidden">
      
      <!-- Vinyl Disc Graphic -->
      <div class="relative my-2">
        <div id="vinylDisc" class="w-36 h-36 rounded-full bg-slate-900 border-4 border-slate-800 shadow-[0_0_30px_rgba(0,0,0,0.9)] flex items-center justify-center relative spinning-vinyl paused-vinyl">
          <div class="w-24 h-24 rounded-full border border-slate-700/60 flex items-center justify-center">
            <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-pink-500 to-rose-600 border border-pink-300/40 flex items-center justify-center">
              <span class="text-xs font-black text-white">ðŸ¤</span>
            </div>
          </div>
          <!-- Groove rings -->
          <div class="absolute inset-0 rounded-full border border-white/5 pointer-events-none"></div>
        </div>
      </div>

      <!-- Track Name & Status -->
      <h3 id="nowPlayingTitle" class="text-sm font-bold text-white mt-3 text-glow-rose">Celestial Lullaby</h3>
      <span id="nowPlayingSub" class="text-[10px] text-pink-300">Tap play to hear our peaceful melody</span>

      <!-- Visualizer Bars -->
      <div id="visualizer" class="flex items-end gap-1.5 h-8 my-3">
        <div class="w-1 bg-pink-400/50 rounded-full h-2 transition-all duration-150"></div>
        <div class="w-1 bg-pink-400/50 rounded-full h-3 transition-all duration-150"></div>
        <div class="w-1 bg-pink-400/50 rounded-full h-2 transition-all duration-150"></div>
        <div class="w-1 bg-pink-400/50 rounded-full h-4 transition-all duration-150"></div>
        <div class="w-1 bg-pink-400/50 rounded-full h-2 transition-all duration-150"></div>
        <div class="w-1 bg-pink-400/50 rounded-full h-5 transition-all duration-150"></div>
        <div class="w-1 bg-pink-400/50 rounded-full h-3 transition-all duration-150"></div>
      </div>

      <!-- Play / Pause Button -->
      <button id="playBtn" onclick="togglePlayMusic()" class="btn-luxury-primary text-xs py-2 px-6">
        <span id="playBtnText">â–¶ Play Melody</span>
      </button>

    </div>

    <!-- Playlist Snippets -->
    <div class="space-y-2">
      <div class="glass-card p-3 border border-white/10 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span class="text-pink-400 text-xs font-bold">01</span>
          <div>
            <h4 class="text-xs font-semibold text-white">Midnight Quiet Hours</h4>
            <p class="text-[10px] text-slate-400">The feeling of staying up late together</p>
          </div>
        </div>
        <span class="text-xs">ðŸŒ™</span>
      </div>

      <div class="glass-card p-3 border border-white/10 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span class="text-pink-400 text-xs font-bold">02</span>
          <div>
            <h4 class="text-xs font-semibold text-white">Echoes of Laughter</h4>
            <p class="text-[10px] text-slate-400">Whenever things felt simple and happy</p>
          </div>
        </div>
        <span class="text-xs">âœ¨</span>
      </div>
    </div>

    <div id="floatingNavBar"></div>

  </main>

  <script src="js/core.js"></script>
  <script>
    initStardustCanvas();
    initCompanionMascot();
    initNavBar(8);

    let isPlaying = false;
    let synthLoopTimer = null;

    function togglePlayMusic() {
      window.soundEngine.init();
      const disc = document.getElementById('vinylDisc');
      const btnText = document.getElementById('playBtnText');
      const bars = document.querySelectorAll('#visualizer div');

      if (!isPlaying) {
        isPlaying = true;
        disc.classList.remove('paused-vinyl');
        btnText.textContent = 'â¸ Pause Melody';
        startAmbientMelody();
      } else {
        isPlaying = false;
        disc.classList.add('paused-vinyl');
        btnText.textContent = 'â–¶ Play Melody';
        stopAmbientMelody();
      }
    }

    // Gentle celestial arpeggio synthesizer loop
    const chords = [
      [261.63, 329.63, 392.00, 523.25], // C Major
      [220.00, 261.63, 329.63, 440.00], // A Minor
      [174.61, 220.00, 261.63, 349.23], // F Major
      [196.00, 246.94, 293.66, 392.00]  // G Major
    ];
    let chordIdx = 0;

    function playChord() {
      if (!isPlaying || !window.soundEngine.ctx) return;
      const ctx = window.soundEngine.ctx;
      const chord = chords[chordIdx];
      chordIdx = (chordIdx + 1) % chords.length;

      chord.forEach((note, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        const now = ctx.currentTime + i * 0.18;
        osc.frequency.setValueAtTime(note, now);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 1.25);
      });

      // Animate visualizer bars
      const bars = document.querySelectorAll('#visualizer div');
      bars.forEach(bar => {
        const h = Math.floor(Math.random() * 24) + 6;
        bar.style.height = `${h}px`;
      });
    }

    function startAmbientMelody() {
      playChord();
      synthLoopTimer = setInterval(playChord, 1800);
    }

    function stopAmbientMelody() {
      clearInterval(synthLoopTimer);
      const bars = document.querySelectorAll('#visualizer div');
      bars.forEach(bar => bar.style.height = '4px');
    }
  </script>
</body>
</html>
